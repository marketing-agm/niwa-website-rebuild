<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Niwa Apartments">
  <!-- Was Magnolia's: a blue #129AE5 square with an M in it, inherited from the
       fork, so every Niwa tab flew another property's mark.

       The N is drawn in the wordmark's own manner — a single continuous
       geometric stroke with round caps — rather than set in a typeface, and it
       is heavier than the lockup's hairline because a 2px stroke disappears at
       16 pixels.

       Round rather than square now, to match the pill buttons, and bleeding to
       all four edges. The letter is the one that shipped before, scaled to 80%
       about the centre: a circle's tightest clearance falls on the diagonals,
       where the round caps reach furthest out, so at full size the N had only
       8.7 units of air there against the square's 14.5. At 80% it has 13.4 —
       near enough the room the square was giving it. Path and stroke scale
       together, so the letterform itself is unchanged. -->
  <circle cx="32" cy="32" r="32" fill="#FFFCCC"/>
  <path d="M20.8 43.2V20.8l22.4 22.4V20.8"
        fill="none" stroke="#0A0A0A" stroke-width="5.6"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
