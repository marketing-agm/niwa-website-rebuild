# Cloudflare Pages project configuration (config as code).
#
# `name` MUST match the Pages project name exactly. Cloudflare reads this file
# during the build, and a mismatch between it and the dashboard project name is
# one of the most common causes of a failed Pages build.
#
# The build output directory is pinned here so it cannot be lost or reset in the
# dashboard. The build command (`npm run build`) still lives in the dashboard.
#
# Pages deploys the output directory itself — there is no deploy command. Do NOT
# use the Workers form of this file (`[assets] directory`, `workers_dev`); on a
# Pages project those keys are ignored and the build output has nowhere to go.
name = "niwa-website-rebuild"
pages_build_output_dir = "./dist"
compatibility_date = "2024-11-01"

# The leads database is NOT declared here.
#
# It was, with a placeholder id standing in until the database existed, and
# that broke every preview deployment: Cloudflare reads this file during the
# build and tries to resolve the binding, and "REPLACE_WITH_ID..." is not a
# database. Four previews failed before it was spotted. A config placeholder
# that only fails remotely is worse than no config at all.
#
# It does not belong here anyway. On a Pages project the D1 binding is set on
# the project, not in this file:
#
#   Workers & Pages -> niwa-website-rebuild -> Settings -> Bindings
#   -> D1 database -> variable name DB, database niwa-leads
#
# Locally, pass it on the command line instead, which needs no id at all:
#
#   npx wrangler pages dev dist --d1 DB=niwa-leads
